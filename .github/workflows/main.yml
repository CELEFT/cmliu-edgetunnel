name: Sync and Obfuscate

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '明文源吗'

permissions:
  contents: write

jobs:
  sync-and-obfuscate:
    runs-on: ubuntu-latest

    steps:
      # ---------- 准备阶段 ----------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Obfuscator
        run: npm install javascript-obfuscator

      - name: Download upstream source
        run: |
          curl -fsSL --max-time 60 \
            "https://raw.githubusercontent.com/cmliu/edgetunnel/main/_worker.js" \
            -o "明文源吗"

      # ---------- 混淆阶段 ----------
      - name: Obfuscate source file
        run: |
          cat > obfuscate.js << 'EOF'
          const JavaScriptObfuscator = require('javascript-obfuscator');
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');

          /* ================= 配置区 ================= */
          const CONFIG = {
            source: '明文源吗',
            output: 'worker.js',   // 固定产物名
            minSize: 1024,
          };

          const OBFUSCATION_OPTIONS = {
            compact: true,
            target: 'browser-no-eval',

            stringArray: true,
            stringArrayEncoding: ['base64'],
            stringArrayThreshold: 1.0,
            stringArrayRotate: true,
            stringArrayShuffle: true,
            stringArrayWrappersCount: 2,
            stringArrayWrappersChainedCalls: false,
            stringArrayWrappersParametersMaxCount: 3,

            renameGlobals: false,
            identifierNamesGenerator: 'mangled-shuffled',
            ignoreImports: true,

            splitStrings: true,
            splitStringsChunkLength: 3,
            unicodeEscapeSequence: true,

            controlFlowFlattening: false,
            deadCodeInjection: false,
            selfDefending: false,
            debugProtection: false,
            debugProtectionInterval: 0,
            disableConsoleOutput: false,

            numbersToExpressions: false,
            simplify: false,
            transformObjectKeys: false,
            domainLock: [],
          };

          /* ================= 工具函数 ================= */
          const log = {
            info: (m) => console.log(`[INFO] ${m}`),
            ok:   (m) => console.log(`[OK]   ${m}`),
            err:  (m) => console.error(`[ERR]  ${m}`),
          };

          const sha256 = (str) =>
            crypto.createHash('sha256').update(str).digest('hex').slice(0, 16);

          const formatSize = (bytes) => `${(bytes / 1024).toFixed(2)} KB`;

          const readSource = (filePath) => {
            if (!fs.existsSync(filePath)) throw new Error(`源文件不存在: ${filePath}`);
            const code = fs.readFileSync(filePath, 'utf8');
            if (!code || code.trim().length === 0) throw new Error(`源文件为空: ${filePath}`);
            const size = Buffer.byteLength(code, 'utf8');
            if (size < CONFIG.minSize) {
              throw new Error(`源文件大小异常 (${size} < ${CONFIG.minSize} 字节)`);
            }
            return code;
          };

          /* ================= 主流程 ================= */
          const run = () => {
            const cwd = process.cwd();
            const srcPath = path.join(cwd, CONFIG.source);
            const outPath = path.join(cwd, CONFIG.output);

            log.info(`读取源文件: ${CONFIG.source}`);
            const originalCode = readSource(srcPath);
            const originalSize = Buffer.byteLength(originalCode, 'utf8');
            log.info(`源文件大小: ${formatSize(originalSize)}  sha256:${sha256(originalCode)}`);

            log.info('开始混淆...');
            const obfuscatedCode = JavaScriptObfuscator
              .obfuscate(originalCode, OBFUSCATION_OPTIONS)
              .getObfuscatedCode();

            const obfuscatedSize = Buffer.byteLength(obfuscatedCode, 'utf8');
            fs.writeFileSync(outPath, obfuscatedCode, 'utf8');

            log.ok(`输出文件: ${CONFIG.output}`);
            log.info(`混淆后大小: ${formatSize(obfuscatedSize)}`);
            log.info(`膨胀率: ${((obfuscatedSize / originalSize) * 100).toFixed(1)}%`);
            log.ok('完成');
          };

          try { run(); }
          catch (err) { log.err(err.message); if (err.stack) console.error(err.stack); process.exit(1); }
          EOF
          node obfuscate.js

      # ---------- 提交阶段 ----------
      - name: Commit and push changes
        id: commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "明文源吗" "worker.js"

          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes, skipping commit."
          else
            SHORT_SHA="${GITHUB_SHA::7}"
            git commit -m "sync & obfuscate: update from cmliu/edgetunnel@main (${SHORT_SHA})"
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      # ---------- 发布阶段（固定 Tag: latest）----------
      - name: Delete existing latest release & tag
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 删除旧 release（若存在）
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          echo "Old latest release cleaned."

      - name: Create fixed release
        if: steps.commit.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest
          body: |
            ## 自动发布（固定 Tag: `latest`）

            - **上游来源**: `cmliu/edgetunnel@main`
            - **触发 commit**: ${{ github.sha }}
            - **运行编号**: #${{ github.run_number }}
            - **产物**: `worker.js`（已混淆）

            > 每次更新会覆盖本 Release，下载链接固定为：
            > `https://github.com/${{ github.repository }}/releases/latest/download/worker.js`
          files: worker.js
          draft: false
          prerelease: false
          make_latest: true
